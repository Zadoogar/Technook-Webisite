<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Technook">
  <!-- Technook mark — Brand System v1.0.
       Path, stroke weight and gradient are taken verbatim from the brand system;
       per its own rule the mark is never redrawn. Source path lives in a 1536
       viewBox at stroke-width 112; here it is scaled 0.24 and translated so the
       ink (not the bounding box) sits centred in the tile.
       Tile radius 22% of tile = 3.4 of 16 grid units. -->
  <defs>
    <linearGradient id="technookTile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B47E8"/>
      <stop offset="1" stop-color="#6822D4"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112.6" fill="url(#technookTile)"/>

  <g transform="translate(66.9 62.6) scale(0.24)">
    <path d="M1140 452 H436 V700 H680 V1160 H900 V452"
          fill="none" stroke="#fff" stroke-width="112"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
